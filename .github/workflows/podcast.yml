name: Publish AI podcast episode

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          PODCAST_LANG: ${{ vars.PODCAST_LANG }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE }}
          PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
          PODCAST_DESCRIPTION: ${{ vars.PODCAST_DESCRIPTION }}
          PODCAST_CATEGORY: ${{ vars.PODCAST_CATEGORY }}
        run: python podcast.py

      - name: Commit and publish
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "New episode $(date -u +%Y-%m-%d)"
          git push
